/*
 * Compact policy-language compatibility corpus. This policy is compiled
 * offline; classes and events are resolved symbolically as protocol-v3 does
 * before the kernel sends its byte layouts.
 */
tree "fs" clone of file by getfile getfile.filename;
primary tree "fs";
tree "domain" test_enter of process;

primary space domains = recursive "domain";
space files = recursive "/" - recursive "/private";
space public_files = recursive "/public";
space combined = space files + space public_files;

domains ENTER domains,
	READ domains, files,
	WRITE files,
	SEE files;

function declared;

function choose
{
	local 0 answer;

	answer = $1 ? FORCE_ALLOW : ALLOW;
	if ($2)
		return DENY;
	return answer;
}

function control_flow
{
	local 0 value;

	value = 0;
	while (value < 3) {
		value++;
		if (value == 2)
			continue;
	}
	for (value = 0; value < 2; value++)
		;
	switch (value) {
	case 2:
		break;
	default:
		return FAKE_ALLOW;
	}
	return;
}

domains mkdir:VS_ALLOW files {
	return choose(0, 0);
}

domains mkdir:NOTIFY_DENY files {
	control_flow();
}

recursive "/public" unlink files {
	return DENY;
}

* getprocess * {
	return ALLOW;
}
