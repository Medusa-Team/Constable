/*
 * Controlled event-object compatibility policy. Decimal trace accumulation
 * freezes source registration order across decision and notification phases.
 */
* _debug_event:VS_ALLOW * {
	_debug_event.trace = _debug_event.trace * 10 + 1;
	subject.value = subject.value + 1;
	return ALLOW;
}

* _debug_event:VS_ALLOW * {
	_debug_event.trace = _debug_event.trace * 10 + 2;
	object.value = object.value + subject.value;
	return FORCE_ALLOW;
}

* _debug_event:VS_ALLOW * {
	_debug_event.trace = _debug_event.trace * 10 + 3;
	subject.value = subject.value * 2;
	return FAKE_ALLOW;
}

* _debug_event:VS_ALLOW * {
	_debug_event.trace = _debug_event.trace * 10 + 4;
	object.value = object.value + 4;
	return DENY;
}

* _debug_event:VS_DENY * {
	_debug_event.trace = _debug_event.trace * 10 + 7;
	subject.value = subject.value + 10;
	return FORCE_ALLOW;
}

* _debug_event:NOTIFY_DENY * {
	_debug_event.trace = _debug_event.trace * 10 + 5;
	subject.value = subject.value + object.value;
	return FORCE_ALLOW;
}

* _debug_event:NOTIFY_DENY * {
	_debug_event.trace = _debug_event.trace * 10 + 6;
	object.value = object.value + 1;
	return ALLOW;
}

* _debug_event:NOTIFY_ALLOW * {
	_debug_event.trace = _debug_event.trace * 10 + 9;
	return ALLOW;
}
