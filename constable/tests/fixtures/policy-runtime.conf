function choose
{
	if ($2)
		return DENY;
	if ($1)
		return FORCE_ALLOW;
	return ALLOW;
}

function control_flow
{
	while ($1)
		return DENY;
	do {
		if ($1)
			return DENY;
	} while ($1);
	for (; $1; 0)
		return DENY;
	switch ($2) {
	case 2:
		break;
	default:
		return DENY;
	}
	return ALLOW;
}

function _debug
{
	if (choose(0, 0) != ALLOW)
		return DENY;
	if (choose(1, 0) != FORCE_ALLOW)
		return DENY;
	if (choose(0, 1) != DENY)
		return DENY;
	if (control_flow(0, 2) != ALLOW)
		return DENY;
	return FORCE_ALLOW;
}
