name: Linux build

on:
  pull_request:
  push:
    branches:
      - master
      - codex/medusa-revival-phase-0

permissions:
  contents: read

jobs:
  build:
    name: Constable reference server (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored protocol UAPI and corpus
        run: sha256sum --check ci/protocol-v4.sha256
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang
      - name: Build libmcompiler
        run: |
          common_flags="-std=c11 -Wall -Wextra -Wpedantic -pedantic-errors -Werror -g -D_GNU_SOURCE"
          make -C libmcompiler \
            CC="${{ matrix.compiler }}" \
            LD="${{ matrix.compiler }}" \
            CFLAGS="$common_flags -fPIC"
      - name: Build Constable
        run: |
          common_flags="-std=c11 -Wall -Wextra -Wpedantic -pedantic-errors -Werror -g -D_GNU_SOURCE"
          make -C constable \
            CC="${{ matrix.compiler }}" \
            CFLAGS="$common_flags -DRBAC -I$GITHUB_WORKSPACE/libmcompiler"
      - name: Test Constable semantics
        run: |
          common_flags="-std=c11 -Wall -Wextra -Wpedantic -pedantic-errors -Werror -g -D_GNU_SOURCE"
          make -C constable test \
            CC="${{ matrix.compiler }}" \
            CFLAGS="$common_flags -DRBAC -I$GITHUB_WORKSPACE/libmcompiler"

  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            name: AddressSanitizer
          - sanitizer: undefined
            name: UndefinedBehaviorSanitizer
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential
      - name: Build and test
        run: ./ci/sanitize.sh ${{ matrix.sanitizer }}
